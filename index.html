<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18372f">
  <meta name="description" content="Stink Pyrenees — premium dog shampoo designed with thick, double-coated dogs in mind. Coming soon.">
  <title>Stink Pyrenees | Coming Soon</title>
  <style>
    :root {color-scheme:light; --forest:#18372f; --cream:#fffaf0}
    *{box-sizing:border-box}
    body{margin:0;background:var(--forest);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--cream)}
    main{min-height:100svh;display:grid;place-items:center;position:relative;isolation:isolate;text-align:center;padding:3rem 1.5rem}
    main::before{content:"";position:absolute;inset:0;z-index:-2;background:url('great-pyrenees.jpg') center top/cover no-repeat}
    main::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,32,26,.85),rgba(10,32,26,.55) 55%,rgba(10,32,26,.16)),linear-gradient(0deg,rgba(10,32,26,.65),transparent 35%)}
    .content{width:min(100%,680px);margin-right:auto;margin-left:clamp(0px,3vw,50px);text-align:left}
    .eyebrow{font-size:.82rem;letter-spacing:.27em;text-transform:uppercase;font-weight:700;color:#f5d59a}
    h1{font-size:clamp(3rem,8vw,6.5rem);line-height:.96;letter-spacing:-.06em;margin:1.1rem 0 1.5rem;text-wrap:balance}
    h2{font-size:clamp(1.35rem,3vw,2rem);font-weight:500;margin:0 0 1rem}
    p{font-size:clamp(1rem,1.8vw,1.18rem);line-height:1.7;max-width:32rem;color:#f1eee5}
    .coming{display:inline-block;border:1px solid rgba(255,250,240,.75);padding:.85rem 1.3rem;border-radius:99px;margin-top:1.1rem;letter-spacing:.18em;font-size:.85rem;font-weight:750}
    footer{position:absolute;bottom:1.4rem;left:1.5rem;right:1.5rem;text-align:center;font-size:.76rem;color:#f1eee5c9}
    @media(max-width:680px){main{align-items:end;padding-bottom:7rem}main::before{background-position:72% top}main::after{background:linear-gradient(0deg,rgba(10,32,26,.96),rgba(10,32,26,.64) 46%,rgba(10,32,26,.08))}.content{margin:0;text-align:center}p{margin-inline:auto}}
  </style>
</head>
<body>
  <main>
    <section class="content" aria-label="Stink Pyrenees coming soon">
      <div class="eyebrow">A better bath is on the way</div>
      <h1>STINK<br>PYRENEES</h1>
      <h2>Big Dogs. Big Coats. Better Baths.</h2>
      <p>We're developing a premium dog shampoo with thick, double-coated breeds in mind. Stay tuned for a fresher way to care for your fluffy best friend.</p>
      <div class="coming">COMING SOON</div>
    </section>
    <footer>© 2026 Stink Pyrenees LLC · Made with big dogs in mind</footer>
  </main>
</body>
</html>
